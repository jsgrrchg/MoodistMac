name: iOS and shared core
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - run: swift test --package-path Packages/MoodistKit
      - run: xcodebuild -project Moodist.xcodeproj -scheme MoodistMac -configuration Debug -destination 'platform=macOS,arch=arm64' build CODE_SIGNING_ALLOWED=NO
      - run: xcodebuild -project Moodist.xcodeproj -scheme MoodistIOS -configuration Debug -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
